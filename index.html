<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Netdeckable</title>
  <meta name="description" content="Netdeckable: which Magic: The Gathering meta decks can you build with your collection, and what are you missing? Also in Italian, Spanish, Portuguese and Japanese." />
  <meta name="theme-color" content="#0f1a1c" />
  <script>
    // tema prima del primo disegno (niente lampo chiaro/scuro): scuro di default
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('mdm.theme')) === 'light' ? 'light' : 'dark' } catch (e) { document.documentElement.dataset.theme = 'dark' }
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
