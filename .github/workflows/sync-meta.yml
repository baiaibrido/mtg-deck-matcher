name: Sync meta
on:
  schedule:
    - cron: '17 3 * * *'   # ogni notte alle 03:17 UTC
  workflow_dispatch:        # avvio manuale dal tab Actions
permissions:
  contents: write
  actions: write   # per tenere attivo l'aggiornamento programmato
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: sync
        run: rm -rf debug && node scripts/sync-meta.mjs
        continue-on-error: true
      - name: Commit (meta aggiornati o pagine di debug)
        run: |
          git config user.name "meta-bot"
          git config user.email "meta-bot@users.noreply.github.com"
          git rm -rq --cached debug 2>/dev/null || true
          git add public/meta public/sitemap.xml
          if [ -d debug ]; then git add -f debug; fi
          git diff --staged --quiet || (git commit -m "meta: aggiornamento $(date -u +%F)" && git push)
      # GitHub spegne le esecuzioni programmate dopo 60 giorni senza attività nel repository: le riattiviamo a ogni giro
      - name: Mantieni attivo l'aggiornamento notturno
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-meta.yml/enable" || true
      - name: Segnala errore
        if: steps.sync.outcome == 'failure'
        run: exit 1
