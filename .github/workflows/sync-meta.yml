name: Sync meta MTGTop8
on:
  schedule:
    - cron: '17 3 * * *'   # ogni notte alle 03:17 UTC
  workflow_dispatch:        # avvio manuale dal tab Actions
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-mtgtop8.mjs
      - name: Commit se cambiato
        run: |
          git config user.name "meta-bot"
          git config user.email "meta-bot@users.noreply.github.com"
          git add public/meta
          git diff --staged --quiet || (git commit -m "meta: aggiornamento $(date -u +%F)" && git push)
